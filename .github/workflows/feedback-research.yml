name: Research feedback

# The research games (research.json in the data repo), collected and sorted like the player feedback
# workflow does your own games, but in their own run next to it: a backlog of thousands of posts
# never holds back your games' data. Each run collects every 5 minutes for about 4 hours, then starts
# the next; the schedule starts one if none is going. See feedback/README.md.
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Start now, replacing the current run
        type: boolean
        default: true
      resort:
        description: Sort these research games' posts again from scratch (app ids, or "all"), after the sorting rules changed
        type: string
        default: ""

permissions:
  contents: write
  actions: write

# One run at a time: a scheduled run waits for the current one, a forced run replaces it.
concurrency:
  group: feedback-research
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # All the data lives in a private repo, written with a deploy key: anyone can read this one.
      - name: Checkout the data
        uses: actions/checkout@v7
        with:
          repository: fourgames/feedback-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: feedback/data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: feedback/requirements.txt

      - name: Install dependencies
        run: pip install -r feedback/requirements.txt

      # Commits made with the workflow token don't trigger other workflows; the dashboard reads
      # the data repo straight through GitHub's API.
      - name: Collect every 5 minutes for 4 hours
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          feedback/loop.sh
        env:
          FEEDBACK_PART: research
          FEEDBACK_RUN_LIMIT: 3600  # a big backlog's sorting can take a while; only a hang is stopped
          FEEDBACK_HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          FEEDBACK_RESORT: ${{ inputs.resort }}
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Start the next run
        if: success()
        run: gh workflow run feedback-research.yml --ref main -f force=false
        env:
          GH_TOKEN: ${{ github.token }}
