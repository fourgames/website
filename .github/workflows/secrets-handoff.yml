# TEMPORARY, removed right after its one run: copies the feedback loop's Actions secrets to the
# server's /home/fourgames/feedback.env.handoff over a one-time SSH key that can only write that file.
# The secrets stay in GitHub (rollback to Actions keeps working). Nothing is printed.
name: Secrets handoff (one-time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the secrets to the server
        env:
          HANDOFF_KEY: ${{ secrets.SERVER_HANDOFF_KEY }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          STEAM_FINANCIAL_KEY: ${{ secrets.STEAM_FINANCIAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          DISCORD_RELEASES_ROLE: ${{ secrets.DISCORD_RELEASES_ROLE }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
        run: |
          umask 077
          printf '%s\n' "$HANDOFF_KEY" > key
          printf '%s\n' "$HOST_KEY" > known_hosts
          for v in STEAM_PUBLISHER_KEY STEAM_FINANCIAL_KEY ANTHROPIC_API_KEY DISCORD_WEBHOOK_URL DISCORD_MENTION \
                   DISCORD_RELEASES_WEBHOOK_URL DISCORD_RELEASES_ROLE TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET \
                   YOUTUBE_API_KEY GEMINI_API_KEY GOOGLE_ALERTS_FEEDS; do
            printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | tr '\n' ' ' | sed 's/ *$//')"
          done > handoff.env
          ssh -i key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            fourgames@82.165.18.23 < handoff.env
          rm -f key known_hosts handoff.env
          echo "sent"
