<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Command center</title>
<!-- Redesign variant 2, "Command center": every game on one dense board, each game's tabs as panels
     on one board, and a drawer for every detail. Local prototype (fb-lab launch config), never deployed.
     Uses the real data in feedback/data when it is there, invented sample data otherwise. -->
<script>
  // Dark first; light when the system asks for it or it was picked here.
  (() => { let t = null; try { t = localStorage.getItem("cc-theme"); } catch {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); })();
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar">
  <span class="brand">Four Games <i>/ command</i></span>
  <nav class="crumbs grow" id="games" aria-label="Games"></nav>
  <span class="badge" id="sample" hidden title="No local copy of the real data was found, so these numbers and posts are invented">Sample data</span>
  <div class="seg" id="range" role="group" aria-label="Time range"></div>
  <a class="chip" href="home.html">Site home</a>
  <button class="chip" id="theme" type="button" aria-label="Switch light and dark">◐</button>
</div>
<main id="main"><p class="empty">Loading…</p></main>
<div id="drawer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
