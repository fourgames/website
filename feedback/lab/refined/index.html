<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard (refined)</title>
<!-- Redesign variant 5, "Refined current look": today's dashboard and site style, restructured for
     fewer clicks. Run with the fb-lab launch config and open /lab/refined/. Local only, never
     deployed. Reads feedback/data when a local copy exists, otherwise the invented sample.js. -->
<script>
try {
	const t = JSON.parse(localStorage.getItem("rf:theme")) || "auto";
	document.documentElement.dataset.theme = t === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
} catch {}
</script>
<link rel="stylesheet" href="refined.css">
</head>
<body>
<div class="topbar">
	<button type="button" id="top-menu" aria-label="Open menu">☰</button>
	<b id="top-title">All games</b>
	<button type="button" id="top-find" aria-label="Search everything">Search</button>
</div>
<div class="shell">
	<nav class="side" id="side" aria-label="Dashboard">
		<div class="brand"><i>4</i> Four Games</div>
		<button type="button" class="find" id="find">Jump to… <kbd>⌘K</kbd></button>
		<a class="nav" id="nav-home" href="#/">All games <span class="count" id="home-count"></span></a>
		<div class="side-label">Games</div>
		<div id="side-games"></div>
		<div class="side-foot">
			<div class="side-label">This prototype</div>
			<a class="nav" id="nav-diff" href="#/diff">What's different</a>
			<a class="nav" href="home.html">Public home page</a>
			<div id="theme" style="padding:6px 8px"></div>
		</div>
	</nav>
	<main class="main" id="main"><p class="empty">Loading…</p></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
