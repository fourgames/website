<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Player Feedback</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  Private player-feedback dashboard. Not linked from the site. The data is read straight from the
  repo (feedback/data, written by .github/workflows/feedback.yml), so it updates without a redeploy.
  Add ?data=<base url> to read another copy of the data, e.g. a local test run.
-->
<style>
/* Five designs share this page; <html data-v="1…5"> picks one. Tokens first, then layout per design. */
:root {
  --page: #0f1012; --panel: #16171a; --surface: #1d1e22; --surface-2: #27282d; --hover: #2f3036;
  --ink: #f2f3f5; --ink-2: #b6bac3; --muted: #80858f; --grid: #292b30; --axis: #3a3d44; --ring: rgba(255, 255, 255, 0.07);
  --accent: #335fff; --accent-ink: #ffffff; --positive: #3987e5; --negative: #e66767;
  --good: #0ca30c; --good-text: #2fbf4a; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --radius: 14px; --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side-w: 0px;
  color-scheme: dark;
}
[data-v="1"] { --side-w: 264px; }
[data-v="3"] { --side-w: 76px; --page: #121212; --panel: #181818; --surface: #1e1e1e; --surface-2: #282828; --hover: #303030; --radius: 10px; --accent: #00b06f; }
[data-v="4"] {
  --side-w: 264px; color-scheme: light;
  --page: #f3f4f7; --panel: #ffffff; --surface: #ffffff; --surface-2: #eff1f4; --hover: #e7e9ee;
  --ink: #111318; --ink-2: #4a4f59; --muted: #7b808a; --grid: #e7e9ed; --axis: #cfd3da; --ring: rgba(16, 24, 40, 0.08);
  --positive: #2a78d6; --negative: #e34948; --good-text: #006300;
}
[data-v="5"] { --page: #0b0c10; --surface: #15161c; --surface-2: #20222a; --hover: #2a2c36; --accent: #7c5cff; --radius: 18px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
[data-v="5"] body { background: radial-gradient(1200px 500px at 10% -10%, rgba(124, 92, 255, 0.18), transparent), var(--page); }
a { color: var(--accent); }
[data-v="1"] a, [data-v="2"] a, [data-v="5"] a { color: #7d9bff; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.icon { width: 18px; height: 18px; flex: none; }

/* Shell */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--ring); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
[data-v="2"] .side, [data-v="5"] .side { display: none; }
[data-v="2"] .app, [data-v="5"] .app { grid-template-columns: minmax(0, 1fr); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; padding: 4px 8px 14px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); flex: none; }
.side-label { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 8px 6px; }
.main { padding: 20px 28px 64px; max-width: 1240px; width: 100%; margin: 0 auto; min-width: 0; }

/* Game switcher: a list in the sidebar, tiles or chips in the strip */
.g-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 6px 8px; color: var(--ink-2); position: relative; }
.g-item:hover { background: var(--hover); color: var(--ink); }
.g-item[aria-current="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.g-item[aria-current="true"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.g-thumb { width: 64px; height: 30px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex: none; box-shadow: 0 0 0 1px var(--ring); }
.g-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.g-sub { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
[data-v="3"] .side { padding: 14px 10px; align-items: center; }
[data-v="3"] .brand span, [data-v="3"] .side-label, [data-v="3"] .g-name, [data-v="3"] .nav-side, [data-v="3"] .side-foot { display: none; }
[data-v="3"] .brand { padding: 4px 0 12px; }
[data-v="3"] .g-item { padding: 4px; justify-content: center; }
[data-v="3"] .g-item[aria-current="true"]::before { left: -10px; }
[data-v="3"] .g-thumb { width: 44px; height: 44px; border-radius: 12px; }
[data-v="3"] .g-item[aria-current="true"] .g-thumb { box-shadow: 0 0 0 2px var(--accent); }

.strip { display: none; gap: 12px; margin-bottom: 20px; }
[data-v="2"] .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
[data-v="2"] .g-item { flex-direction: column; align-items: stretch; padding: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 0 0 1px var(--ring); transition: transform 0.15s, box-shadow 0.15s; }
[data-v="2"] .g-item:hover { transform: translateY(-2px); }
[data-v="2"] .g-item[aria-current="true"] { box-shadow: 0 0 0 2px var(--accent); }
[data-v="2"] .g-item::before { display: none; }
[data-v="2"] .g-thumb { width: 100%; height: auto; aspect-ratio: 460 / 215; border-radius: 0; box-shadow: none; }
[data-v="2"] .g-name { padding: 8px 12px 10px; font-size: 14px; }
[data-v="5"] .strip { display: flex; flex-wrap: wrap; }
[data-v="5"] .g-item { width: auto; border-radius: 99px; padding: 4px 14px 4px 4px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring); }
[data-v="5"] .g-item::before { display: none; }
[data-v="5"] .g-item[aria-current="true"] { background: var(--accent); color: #fff; box-shadow: none; }
[data-v="5"] .g-thumb { width: 30px; height: 30px; border-radius: 50%; }
[data-v="5"] .g-sub { display: none; }

/* Header */
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.top img { width: 120px; height: 56px; object-fit: cover; border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); }
[data-v="2"] .top img, [data-v="5"] .top img { display: none; }
.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.updated { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); vertical-align: 4px; margin-left: 8px; }

/* Views nav: a list in the sidebar (1, 4), tabs on top (2, 3, 5) */
.nav-side { display: flex; flex-direction: column; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-radius: 10px; padding: 8px 10px; color: var(--ink-2); font-weight: 500; text-align: left; }
.nav-btn:hover { background: var(--hover); color: var(--ink); }
.nav-btn[aria-current="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.nav-btn .count { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px 8px 0; }
.nav-top { display: none; gap: 6px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
[data-v="2"] .nav-top, [data-v="3"] .nav-top, [data-v="5"] .nav-top { display: flex; }
.nav-top .nav-btn { width: auto; white-space: nowrap; }
[data-v="2"] .nav-top .nav-btn { border-radius: 99px; padding: 7px 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring); }
[data-v="2"] .nav-top .nav-btn[aria-current="true"] { background: var(--accent); color: #fff; box-shadow: none; }
[data-v="2"] .nav-top .nav-btn[aria-current="true"] .count { color: rgba(255, 255, 255, 0.8); }
[data-v="3"] .nav-top { gap: 0; border-bottom: 1px solid var(--grid); }
[data-v="3"] .nav-top .nav-btn { border-radius: 0; background: none; border-bottom: 2px solid transparent; padding: 10px 14px; }
[data-v="3"] .nav-top .nav-btn[aria-current="true"] { border-bottom-color: var(--accent); }
[data-v="5"] .nav-top { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 10px; }
[data-v="5"] .nav-top .nav-btn { flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: var(--radius); background: var(--surface); box-shadow: 0 0 0 1px var(--ring); }
[data-v="5"] .nav-top .nav-btn .count { margin: 0; font-size: 20px; color: var(--ink); }
[data-v="5"] .nav-top .nav-btn[aria-current="true"] { box-shadow: 0 0 0 2px var(--accent); background: linear-gradient(160deg, rgba(124, 92, 255, 0.22), var(--surface) 70%); }

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: var(--radius); padding: 14px 16px 10px; min-width: 0; position: relative; overflow: hidden; }
[data-v="4"] .kpi, [data-v="4"] .card, [data-v="4"] .chart-card { box-shadow: 0 0 0 1px var(--ring), 0 1px 3px rgba(16, 24, 40, 0.06); }
[data-v="5"] .kpi::after { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--accent), #2fd5ff); }
[data-v="5"] .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
[data-v="5"] .kpi:nth-child(6):last-child { grid-column: span 2; }
[data-v="5"] .kpi:nth-child(5):last-child { grid-column: span 3; }
[data-v="5"] .kpi:first-child { grid-column: span 2; grid-row: span 2; }
[data-v="5"] .kpi:first-child .value { font-size: 44px; }
[data-v="5"] .kpi:first-child .spark { height: 96px; }
.kpi .label { color: var(--ink-2); font-size: 12px; font-weight: 500; }
.kpi .sub, .kpi .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.kpi .sub { color: var(--muted); font-size: 12px; }
.spark { display: block; width: 100%; height: 34px; margin-top: 6px; }
[data-v="3"] .kpi { padding: 10px 12px 8px; }
[data-v="3"] .kpi .value { font-size: 22px; }

/* Buttons and one-click filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
.filters input[type="search"] { flex: 1 1 200px; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 7px 12px; min-height: 36px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.chips button { background: none; border: 0; border-radius: 8px; padding: 5px 12px; color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chips button:hover { color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 0 0 1px var(--ring); }
[data-v="2"] .chips button[aria-pressed="true"], [data-v="5"] .chips button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { background: var(--surface-2); border: 0; border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 500; min-height: 32px; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.done { color: var(--good-text); }

/* Cards, posts */
.card { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.card-head { display: flex; gap: 12px; align-items: flex-start; }
.card-head .main-col { flex: 1; min-width: 0; }
.card h3 { font-size: 15px; margin: 0 0 6px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--ink-2); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); text-decoration: none; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.u-urgent .dot { background: var(--critical); }
.u-high .dot { background: var(--serious); }
.u-medium .dot { background: var(--warning); }
.u-low .dot { background: var(--muted); }
.s-fixed { color: var(--good-text); }
.s-still { color: var(--critical); }
.mentions { text-align: center; min-width: 64px; background: var(--surface-2); border-radius: 10px; padding: 6px 8px; }
.mentions b { display: block; font-size: 20px; line-height: 1.1; }
.mentions span { color: var(--muted); font-size: 11px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.post { border-top: 1px solid var(--grid); padding: 12px 0 2px; margin-top: 10px; }
.card > .post:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.post .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
.post details { color: var(--ink-2); font-size: 13px; }
.post summary { cursor: pointer; }
.reply { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
.reply .en { color: var(--muted); }
.reply-row { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.vote-up { color: var(--positive); font-weight: 600; }
.vote-down { color: var(--negative); font-weight: 600; }
.empty { color: var(--muted); padding: 32px; text-align: center; }
.more { display: block; margin: 12px auto; }

/* Charts */
.chart-card { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; position: relative; }
.chart-card h3 { margin: 0; font-size: 14px; }
.chart-card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
svg.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
svg.chart .base { stroke: var(--axis); stroke-width: 1; }
svg.chart .release { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
svg.chart text.release-label { fill: var(--ink-2); font-size: 10px; }
svg.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.band { fill: var(--warning); opacity: 0.14; }
.tip { position: absolute; pointer-events: none; background: var(--surface); box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 7px 11px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
.tip b { font-size: 14px; }
.tip .t { color: var(--muted); }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 7px 10px; align-items: center; font-size: 13px; }
.bars .bar { height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .n { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
table.data { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
table.data td, table.data th { padding: 2px 10px 2px 0; text-align: left; }
.chart-card details { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 6px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }

/* Design picker (remove once a design is chosen) */
.picker { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 6px; background: #0b0b0b; color: #fff; border-radius: 99px; padding: 6px 6px 6px 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); font-size: 13px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
.picker span { white-space: nowrap; margin-right: 4px; }
.picker button { border: 0; border-radius: 99px; padding: 6px 12px; background: #262626; color: #ddd; white-space: nowrap; font-size: 13px; }
.picker button[aria-pressed="true"] { background: #fff; color: #000; font-weight: 600; }

/* Phones: every design gets the strip as chips and the views as scrolling tabs */
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding: 16px 16px 80px; }
  .strip, [data-v] .strip { display: flex; overflow-x: auto; gap: 8px; margin: 0 -16px 16px; padding: 0 16px 4px; }
  [data-v] .strip .g-item { width: auto; flex: none; flex-direction: row; border-radius: 99px; padding: 4px 14px 4px 4px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring); transform: none; }
  [data-v] .strip .g-item[aria-current="true"] { background: var(--accent); color: #fff; }
  [data-v] .strip .g-thumb { width: 30px; height: 30px; aspect-ratio: auto; border-radius: 50%; }
  [data-v] .strip .g-name { padding: 0; font-size: 13px; }
  [data-v] .strip .g-sub { display: none; }
  .nav-top, [data-v] .nav-top { display: flex; grid-template-columns: none; }
  [data-v] .nav-top .nav-btn { flex-direction: row; align-items: center; padding: 7px 14px; border-radius: 99px; }
  [data-v] .nav-top .nav-btn .count { font-size: 11px; color: inherit; margin-left: 4px; }
  .top img { width: 72px; height: 34px; }
  .top h1 { font-size: 20px; }
  [data-v="5"] .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .value { font-size: 22px; }
}
</style>

</head>
<body>
<div class="app">
  <aside class="side" aria-label="Games and views">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span>Player feedback</span></div>
    <div class="side-label">Games</div>
    <div id="games-side"></div>
    <div class="side-label">Views</div>
    <nav class="nav-side" id="nav-side" aria-label="Views"></nav>
    <div class="side-foot updated" id="updated-side"></div>
  </aside>
  <div class="main">
    <div class="strip" id="games-strip" aria-label="Games"></div>
    <header class="top">
      <img id="capsule" alt="" hidden>
      <div><h1 id="title">Player feedback</h1><div class="updated" id="updated">Loading…</div></div>
    </header>
    <section class="kpis" id="stats" aria-label="Summary"></section>
    <nav class="nav-top" id="nav-top" aria-label="Views"></nav>
    <main id="view"></main>
  </div>
</div>
<div class="picker" id="picker" role="group" aria-label="Design"></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const DATA = (new URLSearchParams(location.search).get("data") || "https://raw.githubusercontent.com/fourgames/website/main/feedback/data").replace(/\/$/, "");
const DAY = 86400;
const URGENCY = { urgent: "Urgent", high: "High", medium: "Medium", low: "Low" };
const KIND = { review: "Review", topic: "Thread", reply: "Reply" };
const state = { index: null, games: {}, game: null, tab: "issues", filters: { issues: { status: "active", q: "" }, suggestions: { status: "active", q: "" }, feed: { kind: "all", category: "all", q: "", shown: 50 }, stats: { range: 90 }, sales: { range: 90 } }, sales: null };

const store = {
  get(k) { try { return localStorage.getItem("fb-dash:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("fb-dash:" + k, v); } catch {} },
};

// DOM helper: h("div.card", {onclick}, child, "text"…). Text always goes in as text nodes.
function h(tag, props, ...kids) {
  const [name, ...classes] = tag.split(".");
  const el = document.createElement(name);
  if (classes.length) el.className = classes.join(" ");
  if (props && (typeof props !== "object" || props instanceof Node || Array.isArray(props))) { kids.unshift(props); props = null; }
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className += " " + v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const svgEl = (tag, attrs = {}) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
const now = () => Math.floor(Date.now() / 1000);
const fmtDate = (t) => new Date(t * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const fmtShort = (t) => new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
function ago(t) {
  const s = now() - t;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < DAY) return Math.round(s / 3600) + " h ago";
  if (s < 30 * DAY) return Math.round(s / DAY) + " d ago";
  return fmtDate(t);
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 1600);
}
async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = h("textarea", { style: "position:fixed;opacity:0" }, text);
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Copied");
  if (button) { const old = button.textContent; button.textContent = "Copied ✓"; button.classList.add("done"); setTimeout(() => { button.textContent = old; button.classList.remove("done"); }, 1500); }
}

async function getJson(path) {
  const res = await fetch(`${DATA}/${path}?t=${Math.floor(Date.now() / 60000)}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

function icon(name) {

  svg.append(svgEl("path", { d: ICONS[name] }));

// One-click filter buttons (replaces every dropdown).
function chips(options, value, onChange, label) {
  const group = h("div.chips", { role: "group", "aria-label": label });
  for (const [v, text] of options) {
    group.append(h("button", { type: "button", "aria-pressed": String(v === value), onclick: (e) => {
      group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", "false"));
      e.currentTarget.setAttribute("aria-pressed", "true");
      onChange(v);
    } }, text));

// A small single-series trend line for the KPI cards.
function spark(values, color = "var(--accent)") {
  const svg = svgEl("svg", { viewBox: "0 0 100 30", preserveAspectRatio: "none", class: "spark", "aria-hidden": "true" });
  if (values.length < 2 || !values.some((v) => v)) return svg;
  const max = Math.max(...values), min = Math.min(0, ...values);
  const pts = values.map((v, i) => [(i / (values.length - 1)) * 100, 28 - ((v - min) / (max - min || 1)) * 26]);
  const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  svg.append(svgEl("path", { d: `${line}L100,30L0,30Z`, fill: color, opacity: 0.14 }));
  svg.append(svgEl("path", { d: line, fill: "none", stroke: color, "stroke-width": 2, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }));
  return svg;
}
// Per-day values for the last `n` days.
function daily(n, valueOf) {
  const today = Math.floor(now() / DAY);
  return Array.from({ length: n }, (_, i) => valueOf((today - n + 1 + i) * DAY));
}

async function init() {
  renderPicker();
  try {
    if (new URLSearchParams(location.search).has("demo")) Object.assign(state, demoData());
    else {
      state.index = await getJson("index.json");
      state.sales = await getJson("sales.json").catch(() => null); // once the Steam key has the Financial permission
    }
  } catch (e) {
    document.getElementById("updated").textContent = "No data yet: the feedback workflow hasn't committed anything. (" + e.message + ")";
    return;
  }
  const games = state.index.games || [];
  const hash = new URLSearchParams(location.hash.slice(1));
  const wanted = Number(hash.get("app") || store.get("app"));
  state.tab = ["issues", "suggestions", "feed", "stats", "sales"].includes(hash.get("tab")) ? hash.get("tab") : state.tab;
  if (games.length) pickGame(games.some((g) => g.appId === wanted) ? wanted : games[0].appId);
  lastCommit();
}

async function lastCommit() {
  const q = new URLSearchParams(location.search);
  if (q.has("demo")) document.getElementById("updated").textContent = "Demo data: made up, to compare the designs";
  if (q.get("data") || q.has("demo")) return;
  try {
    const res = await fetch("https://api.github.com/repos/fourgames/website/commits?path=feedback/data&per_page=1");
    const [c] = await res.json();
    if (c) document.getElementById("updated").textContent = "Data last changed " + ago(Date.parse(c.commit.committer.date) / 1000);
  } catch {}
}

function renderGames() {
  const games = state.index.games || [];
  const item = (g) => h("button.g-item", { type: "button", title: g.name, "aria-current": String(state.game?.appId === g.appId), onclick: () => pickGame(g.appId) },
    g.capsule ? h("img.g-thumb", { src: g.capsule, alt: "", loading: "lazy" }) : h("span.g-thumb"),
    h("span.g-name", g.name, h("span.g-sub", g.status === "upcoming" ? "Coming soon" : "Released")));
  document.getElementById("games-side").replaceChildren(...games.map(item));
  document.getElementById("games-strip").replaceChildren(...games.map(item));
}

async function pickGame(appId) {
  store.set("app", appId);
  const meta = state.index.games.find((g) => g.appId === appId);
  if (!state.games[appId]) {
    document.getElementById("view").replaceChildren(h("p.empty", "Loading…"));
    try {
      state.games[appId] = await getJson(`games/${appId}.json`);
    } catch (e) {
      state.game = { appId, meta, items: {}, issues: {}, players: [], releases: [], reviewTotals: {} };
      render();
      document.getElementById("view").replaceChildren(h("p.empty", "No data for this game yet."));
      return;
    }
  }
  state.game = { ...state.games[appId], meta };
  render();
}

function setHash() {
  history.replaceState(null, "", `${location.search}#app=${state.game.appId}&tab=${state.tab}`);
}

// ---------------------------------------------------------------------------
// Derived data
// ---------------------------------------------------------------------------

const items = () => Object.values(state.game.items || {});
const issues = (kind) => Object.values(state.game.issues || {}).filter((i) => i.kind === kind);
const english = (item) => (item.triage && item.triage.english) || item.text || "";
const isActive = (i) => i.status !== "likely_fixed";

function playersAt(series, t) {
  let v = null;
  for (const [ts, n] of series) { if (ts > t) break; v = n; }
  return v;
}

function renderHeader() {
  const meta = state.game.meta || {};
  const img = document.getElementById("capsule");
  img.hidden = !meta.capsule;
  if (meta.capsule) img.src = meta.capsule;
  document.getElementById("title").replaceChildren(meta.name || "", h("span.pill", meta.status === "upcoming" ? "Coming soon" : "Released"));
}

function renderStats() {
  const g = state.game;
  const series = g.players || [];
  const t = now();
  const current = series.length ? series[series.length - 1][1] : null;
  const inDay = series.filter(([ts]) => ts >= t - DAY).map(([, n]) => n);
  const peak = Math.max(...inDay, playersAt(series, t - DAY) ?? 0, current ?? 0);
  const peaks = daily(14, (d) => Math.max(playersAt(series, d) ?? 0, ...series.filter(([ts]) => ts >= d && ts < d + DAY).map(([, n]) => n)));
  const totalsKey = Object.keys(g.reviewTotals || {}).sort().pop();
  const totals = totalsKey ? g.reviewTotals[totalsKey] : null;
  const reviewsPerDay = daily(14, (d) => items().filter((i) => i.kind === "review" && i.created >= d && i.created < d + DAY).length);
  const postsPerDay = daily(14, (d) => items().filter((i) => !i.dev && i.created >= d && i.created < d + DAY).length);
  const bugs = issues("bug").filter(isActive);
  const urgent = bugs.filter((i) => i.urgency === "urgent" || i.urgency === "high");
  const still = Object.values(g.issues || {}).filter((i) => i.status === "still_happening");
  const fresh = items().filter((i) => !i.dev && i.created >= t - DAY);
  const release = (g.releases || []).at(-1);
  const salesDaysList = state.sales ? salesDays() : [];
  const byDay = new Map(salesDaysList);
  const revenue = daily(14, (d) => byDay.get(new Date(d * 1000).toISOString().slice(0, 10))?.net || 0);

  const tile = (label, value, sub, trend, color) => h("div.kpi", h("div.label", label), h("div.value", value), sub ? h("div.sub", sub) : null, trend ? spark(trend, color) : null);
  const pct = totals && totals.positive + totals.negative ? Math.round((100 * totals.positive) / (totals.positive + totals.negative)) + "%" : "–";
  document.getElementById("stats").replaceChildren(
    tile("Players now", current ?? "–", current != null ? `${peak} peak today` : "not released", peaks),
    tile("Positive reviews", pct, totals ? `${totals.positive} 👍 · ${totals.negative} 👎` : "no reviews yet", reviewsPerDay, "var(--positive)"),
    tile("Open bugs", bugs.length, still.length ? `${still.length} still happening` : urgent.length ? `${urgent.length} high or urgent` : "none high or urgent"),
    tile("New posts", fresh.length, "last 24 h", postsPerDay),
    salesDaysList.length ? tile("Revenue, 7 d", usd(revenue.slice(-7).reduce((a, b) => a + b, 0)), "net, after refunds", revenue, "var(--good)") : null,
    tile("Latest update", release ? (release.version ? "v" + release.version : "–") : "–", release ? `${release.version ? "" : release.name + " · "}${ago(release.time)}` : "none yet"),
  );
}

function render() {
  renderGames();
  renderHeader();
  renderStats();
  const counts = {
    issues: issues("bug").filter(isActive).length,
    suggestions: issues("suggestion").filter(isActive).length,
    feed: items().filter((i) => !i.dev).length,
  };
  const tabs = [["issues", "Issues"], ["suggestions", "Suggestions"], ["feed", "Feed"], ["stats", "Stats"], ["sales", "Sales"]];
  const buttons = () => tabs.map(([id, label]) =>
    h("button.nav-btn", { type: "button", "aria-current": String(state.tab === id), onclick: () => { state.tab = id; render(); } },
      icon(id), h("span", label), counts[id] != null ? h("span.count", counts[id]) : null));
  document.getElementById("nav-side").replaceChildren(...buttons());
  document.getElementById("nav-top").replaceChildren(...buttons());
  setHash();
  const view = { issues: () => issueView("bug"), suggestions: () => issueView("suggestion"), feed: feedView, stats: statsView, sales: salesView }[state.tab]();
  document.getElementById("view").replaceChildren(view);
}

function issueView(kind) {
  const f = state.filters[kind === "bug" ? "issues" : "suggestions"];
  const wrap = h("div");
  const list = h("div");
  const draw = () => {
    const q = f.q.toLowerCase();
    const shown = issues(kind)
      .filter((i) => f.status === "all" || (f.status === "active" ? isActive(i) : f.status === "still" ? i.status === "still_happening" : i.status === "likely_fixed"))
      .filter((i) => !q || (i.title + " " + i.area + " " + (i.summary || "")).toLowerCase().includes(q))
      .sort((a, b) => b.priority - a.priority);
    list.replaceChildren(...(shown.length ? shown.map((i) => issueCard(i)) : [h("p.empty", kind === "bug" ? "No issues here." : "No suggestions here.")]));
  };
  const status = chips([["active", "Open"], ["still", "Still happening"], ["fixed", "Likely fixed"], ["all", "All"]], f.status, (v) => { f.status = v; draw(); }, "Status");
  const search = h("input", { type: "search", placeholder: "Search issues", value: f.q, oninput: (e) => { f.q = e.target.value; draw(); } });
  wrap.append(h("div.filters", status, search), list);
  draw();
  return wrap;
}

function urgencyBadge(u) {
  return h(`span.badge.u-${u}`, h("span.dot", { "aria-hidden": "true" }), URGENCY[u] || u);
}

function statusBadge(issue) {
  if (issue.status === "likely_fixed")
    return h("a.badge.s-fixed", { href: issue.fixedUrl, target: "_blank", rel: "noopener", title: issue.fixReason || "" }, "✓ Likely fixed in " + issue.fixedIn);
  if (issue.status === "still_happening")
    return h("span.badge.s-still", { title: issue.fixReason || "" }, `↻ Still happening after ${issue.fixedIn}`);
  return null;
}

function issueCard(issue) {
  const posts = issue.items.map((id) => state.game.items[id]).filter(Boolean).sort((a, b) => b.created - a.created);
  const postList = h("div", { hidden: true });
  let filled = false;
  const toggle = h("button.btn", { onclick: () => {
    if (!filled) { postList.append(...posts.map(postView)); filled = true; }
    postList.hidden = !postList.hidden;
    toggle.textContent = postList.hidden ? `Show ${plural(posts.length, "post")}` : "Hide posts";
  } }, `Show ${plural(posts.length, "post")}`);
  const copyText = issue.kind === "bug" ? issue.fixPrompt : suggestionText(issue, posts);
  const copyBtn = h("button.btn.primary", { onclick: (e) => copy(copyText, e.currentTarget) }, issue.kind === "bug" ? "Copy fix prompt" : "Copy summary");
  const linkBtn = h("button.btn", { onclick: (e) => copy(posts.map((p) => p.url).join("\n"), e.currentTarget) }, "Copy links");
  return h("article.card",
    h("div.card-head",
      h("div.main-col",
        h("h3", issue.title),
        h("div.meta", urgencyBadge(issue.urgency), statusBadge(issue), h("span", issue.area), h("span", (issue.languages || []).join(", ")),
          h("span", `last ${ago(issue.lastSeen)}`), issue.negativeReviews ? h("span.vote-down", `${issue.negativeReviews} 👎 review${issue.negativeReviews === 1 ? "" : "s"}`) : null)),
      h("div.mentions", h("b", issue.mentions), h("span", issue.mentions === 1 ? "player" : "players"))),
    issue.summary ? h("p", { style: "margin:6px 0 0;color:var(--ink-2)" }, issue.summary) : null,
    h("div.actions", copyBtn, toggle, linkBtn),
    postList);
}

function suggestionText(issue, posts) {
  return [
    `${state.game.meta.name} suggestion: ${issue.title}`,
    `${plural(issue.mentions, "player")} (${(issue.languages || []).join(", ")}), area: ${issue.area}`,
    "",
    ...posts.slice(0, 10).map((p) => `- "${english(p).replace(/\s+/g, " ").slice(0, 300)}" ${p.url}`),
  ].join("\n");
}

function postView(item) {
  const t = item.triage || {};
  const parent = item.topic ? state.game.items[item.topic] : null;
  const translated = t.english && t.english.trim() !== (item.text || "").trim();
  const flipped = (item.flips || []).at(-1);
  return h("div.post",
    h("div.meta",
      h("b", KIND[item.kind]),
      item.kind === "review" ? h(item.votedUp ? "span.vote-up" : "span.vote-down", item.votedUp ? "👍 Recommended" : "👎 Not recommended") : null,
      item.kind === "review" && item.playtime != null ? h("span", `${item.playtime} h played`) : null,
      item.author?.name ? h("span", item.author.name) : null,
      t.language ? h("span", t.language) : null,
      h("span", fmtDate(item.created)),
      item.edited ? h("span.badge", { title: `Edited · ${(item.versions || []).length} earlier version(s) kept` }, "edited") : null,
      flipped ? h("span.badge", { class: flipped.to === "negative" ? "s-still" : "s-fixed" }, `flipped ${flipped.to} ${fmtShort(flipped.at)}`) : null,
      item.deleted ? h("span.badge.s-still", "deleted on Steam") : null,
      t.category ? h("span.badge", t.category) : null,
      t.urgency ? urgencyBadge(t.urgency) : null,
      h("a", { href: item.url, target: "_blank", rel: "noopener" }, "Open on Steam ↗")),
    parent ? h("div.meta", "in “", parent.title || "thread", "”") : null,
    item.title ? h("div", h("b", item.title)) : null,
    h("div.text", english(item)),
    translated ? h("details", h("summary", `Original (${t.language})`), h("div.text", item.text)) : null,
    (item.versions || []).length ? h("details", h("summary", `Earlier versions (${item.versions.length})`),
      ...item.versions.slice().reverse().map((v) => h("div.text", `${fmtDate(v.at)}${v.votedUp == null ? "" : v.votedUp ? " · 👍" : " · 👎"}\n${v.title ? v.title + "\n" : ""}${v.text}`))) : null,
    item.devResponse ? h("details", h("summary", "Your reply on Steam"), h("div.text", item.devResponse)) : null,
    t.reply ? h("div.reply",
      h("div.reply-row",
        h("div", h("div", "💬 ", t.reply.text), t.reply.text !== t.reply.english ? h("div.en", t.reply.english) : null),
        h("button.btn", { onclick: (e) => copy(t.reply.text, e.currentTarget) }, "Copy reply"))) : null,
  );
}

function feedView() {
  const f = state.filters.feed;
  const wrap = h("div");
  const list = h("div");
  const draw = () => {
    const q = f.q.toLowerCase();
    const all = items()
      .filter((i) => !i.dev)
      .filter((i) => f.kind === "all" || i.kind === f.kind)
      .filter((i) => f.category === "all" || (f.category === "pending" ? !i.triage : i.triage?.category === f.category))
      .filter((i) => !q || (english(i) + " " + (i.text || "") + " " + (i.title || "")).toLowerCase().includes(q))
      .sort((a, b) => Math.max(b.created, b.updated || 0) - Math.max(a.created, a.updated || 0));
    const shown = all.slice(0, f.shown);
    list.replaceChildren(...(shown.length ? shown.map((i) => h("div.card", postView(i))) : [h("p.empty", "Nothing here yet.")]));
    if (all.length > shown.length) list.append(h("button.btn.more", { onclick: () => { f.shown += 50; draw(); } }, `Show more (${all.length - shown.length} left)`));
  };
  const sel = (label, key, options) => chips(options, f[key], (v) => { f[key] = v; f.shown = 50; draw(); }, label);
  wrap.append(
    h("div.filters",
      sel("Type", "kind", [["all", "All posts"], ["review", "Reviews"], ["topic", "Threads"], ["reply", "Replies"]]),
      sel("Category", "category", [["all", "Any category"], ["bug", "Bugs"], ["suggestion", "Suggestions"], ["question", "Questions"], ["praise", "Praise"], ["pending", "Not triaged yet"]]),
      h("input", { type: "search", placeholder: "Search posts", value: f.q, oninput: (e) => { f.q = e.target.value; f.shown = 50; draw(); } })),
    list);
  draw();
  return wrap;
}

function statsView() {
  const f = state.filters.stats;
  const wrap = h("div");
  const body = h("div");
  const draw = () => {
    const end = now();
    const start = f.range ? end - f.range * DAY : Math.min(end - 7 * DAY, ...[...(state.game.players || []).map((p) => p[0]), ...items().map((i) => i.created)]);
    const releases = (state.game.releases || []).filter((r) => r.time >= start && r.time <= end);
    body.replaceChildren(
      playersChart(start, end, releases),
      reviewsChart(start, end, releases),
      h("div.grid-2", breakdown("Posts by category", start, (i) => i.triage?.category), breakdown("Posts by language", start, (i) => i.triage?.language)),
    );
  };
  const range = chips([[7, "7D"], [30, "30D"], [90, "90D"], [365, "1Y"], [0, "All"]], f.range, (v) => { f.range = v; draw(); }, "Time range");
  wrap.append(h("div.filters", range), body);
  draw();
  return wrap;
}

const W = 760, H = 220, M = { top: 18, right: 12, bottom: 24, left: 40 };

function niceMax(v) {
  if (v <= 4) return Math.max(4, Math.ceil(v));
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

function timeAxis(svg, x, start, end) {
  const span = end - start;
  const step = span <= 10 * DAY ? DAY : span <= 60 * DAY ? 7 * DAY : span <= 400 * DAY ? 30 * DAY : 90 * DAY;
  const first = Math.ceil(start / DAY) * DAY;
  let last = -1e9;
  for (let t = first; t <= end; t += step) {
    const px = x(t);
    if (px - last < 60) continue;
    last = px;
    const label = svgEl("text", { x: px, y: H - 6, "text-anchor": "middle" });
    label.textContent = fmtShort(t);
    svg.append(label);
  }
}

function yAxis(svg, y, max, fmt = (v) => v) {
  for (const v of [0, max / 2, max]) {
    svg.append(svgEl("line", { x1: M.left, x2: W - M.right, y1: y(v), y2: y(v), class: v === 0 ? "base" : "grid" }));
    const t = svgEl("text", { x: M.left - 6, y: y(v) + 4, "text-anchor": "end" });
    t.textContent = fmt(Math.round(v * 10) / 10);
    svg.append(t);
  }
}

function releaseMarkers(svg, x, releases) {
  let lastLabel = -1e9;
  for (const r of releases) {
    const px = x(r.time);
    svg.append(svgEl("line", { x1: px, x2: px, y1: M.top - 4, y2: H - M.bottom, class: "release" }));
    if (px - lastLabel > 40) {
      const t = svgEl("text", { x: px + 3, y: M.top - 6, class: "release-label" });
      t.textContent = r.version ? "v" + r.version : r.name.slice(0, 18);
      svg.append(t);
      lastLabel = px;
    }
  }
}

function chartCard(title, sub, legend, svg, table) {
  const card = h("div.chart-card", h("h3", title), h("div.sub", sub), legend, svg, table);
  const tip = h("div.tip");
  card.append(tip);
  return { card, tip };
}

function showTip(card, tip, svg, px, py, lines) {
  tip.replaceChildren(...lines);
  tip.style.display = "block";
  const box = svg.getBoundingClientRect(), cbox = card.getBoundingClientRect();
  const sx = box.width / W, sy = box.height / H;
  let left = box.left - cbox.left + px * sx + 12;
  if (left + tip.offsetWidth > cbox.width - 8) left = box.left - cbox.left + px * sx - tip.offsetWidth - 12;
  tip.style.left = Math.max(4, left) + "px";
  tip.style.top = box.top - cbox.top + Math.max(0, py * sy - 20) + "px";
}

function playersChart(start, end, releases) {
  const series = state.game.players || [];
  // A step line: each stored sample holds until the next one (samples are stored only on change).
  const pts = [];
  const first = playersAt(series, start);
  if (first != null) pts.push([start, first]);
  for (const [t, n] of series) if (t >= start && t <= end) pts.push([t, n]);
  if (pts.length) pts.push([end, pts[pts.length - 1][1]]);
  const max = niceMax(Math.max(1, ...pts.map((p) => p[1])));
  const x = (t) => M.left + ((t - start) / (end - start)) * (W - M.left - M.right);
  const y = (v) => H - M.bottom - (v / max) * (H - M.top - M.bottom);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Concurrent players over time" });
  yAxis(svg, y, max);
  timeAxis(svg, x, start, end);
  releaseMarkers(svg, x, releases);
  if (pts.length) {
    let d = `M${x(pts[0][0])},${y(pts[0][1])}`;
    for (let i = 1; i < pts.length; i++) d += `H${x(pts[i][0])}V${y(pts[i][1])}`;
    svg.append(svgEl("path", { d, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round" }));
  }
  const cross = svgEl("line", { y1: M.top, y2: H - M.bottom, class: "cross", visibility: "hidden" });
  const dot = svgEl("circle", { r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  svg.append(cross, dot);
  const table = h("details", h("summary", "Data table"),
    h("table.data", h("tr", h("th", "Time"), h("th", "Players")), ...series.filter(([t]) => t >= start).slice(-200).reverse().map(([t, n]) => h("tr", h("td", new Date(t * 1000).toLocaleString()), h("td", n)))));
  const { card, tip } = chartCard("Concurrent players", pts.length ? "Steam's current player count, sampled every run. Dashed lines are updates." : "No player data in this range.", null, svg, table);
  svg.addEventListener("pointermove", (e) => {
    if (!pts.length) return;
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const t = Math.min(end, Math.max(start, start + ((px - M.left) / (W - M.left - M.right)) * (end - start)));
    const v = playersAt(pts, t);
    if (v == null) return;
    cross.setAttribute("x1", x(t)); cross.setAttribute("x2", x(t)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(t)); dot.setAttribute("cy", y(v)); dot.setAttribute("visibility", "visible");
    const near = releases.find((r) => Math.abs(x(r.time) - x(t)) < 6);
    showTip(card, tip, svg, x(t), y(v), [h("div", h("b", v), " players"), h("div.t", new Date(t * 1000).toLocaleString()), near ? h("div.t", "Update: " + (near.version ? "v" + near.version : near.name)) : null].filter(Boolean));
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
  return card;
}

function reviewsChart(start, end, releases) {
  // New reviews per day (or week, for long ranges): recommended up, not recommended down.
  const bucket = end - start > 120 * DAY ? 7 * DAY : DAY;
  const b0 = Math.floor(start / bucket) * bucket;
  const n = Math.ceil((end - b0) / bucket);
  const up = new Array(n).fill(0), down = new Array(n).fill(0);
  for (const i of items()) {
    if (i.kind !== "review" || i.created < start) continue;
    const k = Math.floor((i.created - b0) / bucket);
    if (k >= 0 && k < n) (i.votedUp ? up : down)[k]++;
  }
  const max = niceMax(Math.max(1, ...up, ...down));
  const x = (t) => M.left + ((t - start) / (end - start)) * (W - M.left - M.right);
  const mid = M.top + (H - M.top - M.bottom) / 2;
  const half = (H - M.top - M.bottom) / 2;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "New reviews over time" });
  for (const v of [max, max / 2]) {
    for (const yy of [mid - (v / max) * half, mid + (v / max) * half]) svg.append(svgEl("line", { x1: M.left, x2: W - M.right, y1: yy, y2: yy, class: "grid" }));
  }
  for (const [v, yy] of [[max, M.top], [0, mid], [max, H - M.bottom]]) {
    const t = svgEl("text", { x: M.left - 6, y: yy + 4, "text-anchor": "end" });
    t.textContent = v;
    svg.append(t);
  }
  timeAxis(svg, x, start, end);
  releaseMarkers(svg, x, releases);
  const bw = Math.max(1, (W - M.left - M.right) / n - 2);
  const bar = (k, value, sign, color) => {
    if (!value) return;
    const bx = Math.max(M.left, x(b0 + k * bucket)) + 1;
    const hgt = Math.max(2, (value / max) * half);
    const r = Math.min(4, bw / 2, hgt);
    // Rounded only at the data end, anchored square on the zero line.
    const d = sign > 0
      ? `M${bx},${mid}V${mid - hgt + r}Q${bx},${mid - hgt} ${bx + r},${mid - hgt}H${bx + bw - r}Q${bx + bw},${mid - hgt} ${bx + bw},${mid - hgt + r}V${mid}Z`
      : `M${bx},${mid}V${mid + hgt - r}Q${bx},${mid + hgt} ${bx + r},${mid + hgt}H${bx + bw - r}Q${bx + bw},${mid + hgt} ${bx + bw},${mid + hgt - r}V${mid}Z`;
    svg.append(svgEl("path", { d, fill: color }));
  };
  for (let k = 0; k < n; k++) { bar(k, up[k], 1, "var(--positive)"); bar(k, down[k], -1, "var(--negative)"); }
  svg.append(svgEl("line", { x1: M.left, x2: W - M.right, y1: mid, y2: mid, class: "base" }));
  const hit = svgEl("rect", { x: M.left, y: M.top, width: W - M.left - M.right, height: H - M.top - M.bottom, fill: "transparent" });
  svg.append(hit);
  const legend = h("div.legend", h("span", h("i", { style: "background:var(--positive)" }), "Recommended"), h("span", h("i", { style: "background:var(--negative)" }), "Not recommended"));
  const total = up.reduce((a, b) => a + b, 0) + down.reduce((a, b) => a + b, 0);
  const table = h("details", h("summary", "Data table"),
    h("table.data", h("tr", h("th", bucket === DAY ? "Day" : "Week of"), h("th", "👍"), h("th", "👎")),
      ...up.map((u, k) => [k, u, down[k]]).filter(([, u, d]) => u || d).reverse().map(([k, u, d]) => h("tr", h("td", fmtDate(b0 + k * bucket)), h("td", u), h("td", d)))));
  const { card, tip } = chartCard(`New reviews per ${bucket === DAY ? "day" : "week"}`, total ? `${total} in this range. Dashed lines are updates.` : "No reviews in this range.", legend, svg, table);
  svg.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const t = start + ((px - M.left) / (W - M.left - M.right)) * (end - start);
    const k = Math.floor((t - b0) / bucket);
    if (k < 0 || k >= n) return;
    showTip(card, tip, svg, px, mid - (up[k] / max) * half, [
      h("div.t", (bucket === DAY ? "" : "Week of ") + fmtDate(b0 + k * bucket)),
      h("div", h("b", up[k]), " recommended"),
      h("div", h("b", down[k]), " not recommended"),
    ]);
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  return card;
}

// ---------------------------------------------------------------------------
// Sales (feedback/sales.py: Steam's per-day totals, Pacific-time dates, USD before Valve's cut)
// ---------------------------------------------------------------------------

const usd = (v, digits = 0) => "$" + Number(v || 0).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const dayTime = (d) => Date.parse(d + "T12:00:00Z") / 1000;

function salesDays() {
  const id = String(state.game.appId);
  return Object.entries(state.sales?.days || {}).map(([d, apps]) => [d, apps[id]]).filter(([, t]) => t);
}

function salesView() {
  if (!state.sales) {
    return h("div.card", h("p", "No sales data yet."), h("p.meta", "Tick the Financial permission on the Steam Web API key (or add STEAM_FINANCIAL_KEY) and the next run fills this in. See feedback/README.md."));
  }
  const f = state.filters.sales;
  const wrap = h("div");
  const body = h("div");
  const draw = () => {
    const days = salesDays();
    const end = now();
    const start = f.range ? end - f.range * DAY : Math.min(end - 7 * DAY, ...days.map(([d]) => dayTime(d) - DAY));
    const inRange = days.filter(([d]) => dayTime(d) >= start);
    const sum = (list, k) => list.reduce((a, [, t]) => a + (t[k] || 0), 0);
    const units = sum(inRange, "units"), refunded = sum(inRange, "returnedUnits");
    const tile = (label, value, sub) => h("div.kpi", h("div.label", label), h("div.value", value), sub ? h("div.sub", sub) : null);
    const releases = (state.game.releases || []).filter((r) => r.time >= start && r.time <= end);
    body.replaceChildren(
      h("section.kpis", { "aria-label": "Sales summary" },
        tile("Net revenue", usd(sum(inRange, "net")), "after refunds and tax, before Steam's cut"),
        tile("Units sold", units - refunded, `${units} sold, ${refunded} refunded`),
        tile("Refund rate", units ? Math.round((100 * refunded) / units) + "%" : "–", "of units sold in this range"),
        tile("Lifetime net", usd(sum(days, "net")), `${sum(days, "units") - sum(days, "returnedUnits")} units since launch`),
        sum(inRange, "activations") ? tile("Key activations", sum(inRange, "activations"), "keys from outside Steam") : null),
      revenueChart(inRange, start, end, releases),
      countryBreakdown(inRange),
    );
  };
  const range = chips([[7, "7D"], [30, "30D"], [90, "90D"], [365, "1Y"], [0, "All"]], f.range, (v) => { f.range = v; draw(); }, "Time range");
  wrap.append(h("div.filters", range, h("span.updated", "Steam days are Pacific time; recent days can still change as payments settle.")), body);
  draw();
  return wrap;
}

function revenueChart(days, start, end, releases) {
  const bucket = end - start > 120 * DAY ? 7 * DAY : DAY;
  const b0 = Math.floor(start / bucket) * bucket;
  const n = Math.ceil((end - b0) / bucket);
  const rows = Array.from({ length: n }, () => ({ net: 0, units: 0, refunded: 0, discount: 0 }));
  for (const [d, t] of days) {
    const k = Math.floor((dayTime(d) - b0) / bucket);
    if (k < 0 || k >= n) continue;
    rows[k].net += t.net || 0; rows[k].units += t.units || 0; rows[k].refunded += t.returnedUnits || 0;
    rows[k].discount = Math.max(rows[k].discount, t.discount || 0);
  }
  const max = niceMax(Math.max(1, ...rows.map((r) => r.net)));
  const x = (t) => M.left + ((t - start) / (end - start)) * (W - M.left - M.right);
  const y = (v) => H - M.bottom - (Math.max(0, v) / max) * (H - M.top - M.bottom);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Net revenue over time" });
  const bw = Math.max(1, (W - M.left - M.right) / n - 2);
  rows.forEach((r, k) => {
    if (r.discount) svg.append(svgEl("rect", { x: Math.max(M.left, x(b0 + k * bucket)), y: M.top, width: bw + 2, height: H - M.top - M.bottom, class: "band" }));
  });
  yAxis(svg, y, max, (v) => usd(v));
  timeAxis(svg, x, start, end);
  releaseMarkers(svg, x, releases);
  rows.forEach((r, k) => {
    if (r.net <= 0) return;
    const bx = Math.max(M.left, x(b0 + k * bucket)) + 1, top = y(r.net), base = H - M.bottom, rr = Math.min(4, bw / 2, base - top);
    svg.append(svgEl("path", { d: `M${bx},${base}V${top + rr}Q${bx},${top} ${bx + rr},${top}H${bx + bw - rr}Q${bx + bw},${top} ${bx + bw},${top + rr}V${base}Z`, fill: "var(--accent)" }));
  });
  svg.append(svgEl("rect", { x: M.left, y: M.top, width: W - M.left - M.right, height: H - M.top - M.bottom, fill: "transparent" }));
  const legend = h("div.legend", h("span", h("i", { style: "background:var(--accent)" }), "Net revenue"), h("span", h("i", { style: "background:var(--warning);opacity:.35" }), "On sale"));
  const table = h("details", h("summary", "Data table"),
    h("table.data", h("tr", h("th", bucket === DAY ? "Day" : "Week of"), h("th", "Net"), h("th", "Sold"), h("th", "Refunded"), h("th", "Discount")),
      ...rows.map((r, k) => [k, r]).filter(([, r]) => r.units || r.net).reverse()
        .map(([k, r]) => h("tr", h("td", fmtDate(b0 + k * bucket)), h("td", usd(r.net, 2)), h("td", r.units), h("td", r.refunded), h("td", r.discount ? r.discount + "%" : "")))));
  const total = rows.reduce((a, r) => a + r.net, 0);
  const { card, tip } = chartCard(`Net revenue per ${bucket === DAY ? "day" : "week"}`, total ? `${usd(total)} in this range. Dashed lines are updates; shaded days had a discount.` : "No sales in this range.", legend, svg, table);
  svg.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const k = Math.floor((start + ((px - M.left) / (W - M.left - M.right)) * (end - start) - b0) / bucket);
    if (k < 0 || k >= n) return;
    const r = rows[k];
    showTip(card, tip, svg, px, y(r.net), [
      h("div.t", (bucket === DAY ? "" : "Week of ") + fmtDate(b0 + k * bucket)),
      h("div", h("b", usd(r.net, 2)), " net"),
      h("div", `${r.units} sold${r.refunded ? `, ${r.refunded} refunded` : ""}`),
      r.discount ? h("div.t", `On sale, up to ${r.discount}% off`) : null,
    ].filter(Boolean));
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  return card;
}

function countryBreakdown(days) {
  const totals = new Map();
  for (const [, t] of days) for (const [cc, [net, units]] of Object.entries(t.countries || {})) {
    const c = totals.get(cc) || [0, 0];
    totals.set(cc, [c[0] + net, c[1] + units]);
  }
  let names;
  try { names = new Intl.DisplayNames(["en"], { type: "region" }); } catch {}
  const rows = [...totals].filter(([, [net]]) => net > 0).sort((a, b) => b[1][0] - a[1][0]).slice(0, 12);
  const max = Math.max(1, ...rows.map(([, [net]]) => net));
  return h("div.chart-card", h("h3", "Top countries"), h("div.sub", rows.length ? "Net revenue in this range" : "No sales in this range."),
    h("div.bars", ...rows.flatMap(([cc, [net, units]]) => [
      h("span", (cc.length === 2 && names?.of(cc)) || cc),
      h("div", h("div.bar", { style: `width:${(100 * net) / max}%` })),
      h("span.n", `${usd(net)} · ${units}`)])));
}

function breakdown(title, start, key) {
  const counts = new Map();
  for (const i of items()) {
    if (i.dev || i.created < start) continue;
    const k = key(i) || "not triaged yet";
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const rows = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return h("div.chart-card", h("h3", title), h("div.sub", rows.length ? "Posts in this range" : "No posts in this range."),
    h("div.bars", ...rows.flatMap(([k, v]) => [h("span", k), h("div", h("div.bar", { style: `width:${(100 * v) / max}%` })), h("span.n", v)])));
}

function demoData() {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const t = now();
  const cdn = (id, hash) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/${hash}/header.jpg`;
  const games = [
    { appId: 2807130, name: "Reforge Front", status: "released", capsule: cdn(2807130, "f709685fb160ba9042b9b5ef18d36fad0b58f5c1") },
    { appId: 3958210, name: "Digging A Hole In Ice With A Chainsaw", status: "released", capsule: cdn(3958210, "2ddbceeb0eec5ee1d6aee9ade2a18b16aa89c8fb") },
    { appId: 5207970, name: "Pomo Valley", status: "upcoming", capsule: cdn(5207970, "2d745a298911828330c2c76f8506f2bb3461bad8") },

    ["bug", "medium", "audio", "Music cuts out after alt-tab", [["German", "Nach Alt-Tab ist die Musik weg.", "The music is gone after alt-tab."]]],
    ["suggestion", "medium", "controls", "Controller support", [["German", "Bitte fügt Controller-Unterstützung hinzu.", "Please add controller support."], ["English", "Would love to play this on the couch with a controller."]]],
    ["suggestion", "low", "settings", "Option to turn off head bob", [["English", "Please add an option to disable the head bob."]]],
    ["praise", "low", "general", null, [["Korean", "재미있어요! 망치가 최고예요.", "It's fun! The hammer is the best."], ["English", "Great little tower defense, the hammer feels amazing."]]],
    ["question", "low", "general", null, [["Brazilian", "Vai ter modo cooperativo?", "Will there be a co-op mode?"]]],
  ];
  const out = { index: { games }, games: {}, sales: { days: {}, apps: {} } };
  for (const g of games) {
    const state = { appId: g.appId, items: {}, issues: {}, players: [], reviewTotals: {}, releases: [] };
    if (g.status === "released") {
      let n = 0, issueN = 1;
      for (let d = 0; d < 120; d++) {
        for (let k = 0; k < Math.floor(rnd() * 3.2); k++) {
          const [category, urgency, area, title, variants] = pick(posts);
          const [language, text, en] = pick(variants);
          const kind = rnd() < 0.65 ? "review" : rnd() < 0.5 ? "topic" : "reply";
          const id = (kind === "review" ? "r" : kind === "topic" ? "t" : "c") + ++n;
          const item = {
            id, kind, created: t - d * DAY - Math.floor(rnd() * DAY), author: { id: "a" + n, name: kind === "review" ? null : pick(["Zhain", "mklesmos", "Paranoia", "Horror Heaven", "vikvik"]) },
            url: `https://store.steampowered.com/app/${g.appId}/`, text, votedUp: category === "praise" || (category === "suggestion" && rnd() < 0.5), playtime: Math.round(rnd() * 200) / 10, versions: [], flips: [],
            title: kind === "topic" ? en || text : undefined,
            triage: { language, english: en, summary: en || text, category, urgency, area, details: category === "bug" ? "Happens on Windows 11 right after the action." : null,
              reply: { text: language === "English" ? "Thanks for the report, we're on it!" : "ありがとうございます！確認中です。", english: "Thanks for the report, we're on it!" } },
          };
          item.updated = item.created;
          if (title) {
            let issue = Object.values(state.issues).find((i) => i.title === title);
            if (!issue) {
              issue = state.issues["I" + issueN] = { id: "I" + issueN++, kind: category, title, area, summary: en || text, status: "open", created: item.created, items: [], languages: [], mentions: 0, urgency, negativeReviews: 0, priority: 0, lastSeen: 0 };
            }
            issue.items.push(id);
            item.issue = issue.id;
          }
          state.items[id] = item;
        }
      }
      for (const issue of Object.values(state.issues)) {
        const its = issue.items.map((i) => state.items[i]);
        issue.mentions = its.length;
        issue.languages = [...new Set(its.map((i) => i.triage.language))];
        issue.lastSeen = Math.max(...its.map((i) => i.created));
        issue.firstSeen = Math.min(...its.map((i) => i.created));

      }
      const lvl = Object.values(state.issues).find((i) => i.title.includes("level 3"));

      if (audio) Object.assign(audio, { status: "likely_fixed", fixedIn: "v1.03", fixedAt: t - 20 * DAY, fixedUrl: "#" });
      let v = 40;
      for (let ts = t - 200 * DAY; ts < t; ts += 3 * 3600) { v = Math.max(0, Math.round(v + (rnd() - 0.48) * 8)); state.players.push([ts, v]); }
      const reviews = Object.values(state.items).filter((i) => i.kind === "review");
      state.reviewTotals.today = { positive: reviews.filter((r) => r.votedUp).length, negative: reviews.filter((r) => !r.votedUp).length };
      state.releases = [[60, "1.01"], [35, "1.02"], [20, "1.03"]].map(([d, version]) => ({ gid: version, name: "Update " + version, version, time: t - d * DAY, url: "#", matched: [] }));
      for (let d = 0; d < 200; d++) {
        const date = new Date((t - d * DAY) * 1000).toISOString().slice(0, 10);
        const sale = (d > 40 && d < 50) || (d > 120 && d < 130);
        const units = Math.max(0, Math.round((sale ? 18 : 7) + (rnd() - 0.5) * 8));
        const refunded = Math.floor(rnd() * units * 0.12);
        const net = Math.round((units * (sale ? 2.99 : 4.99) - refunded * 4) * 0.9 * 100) / 100;
        const day = (out.sales.days[date] ||= {});
        day[g.appId] = { net, units, returnedUnits: refunded, discount: sale ? 40 : 0, countries: { US: [net * 0.4, Math.round(units * 0.4)], DE: [net * 0.2, Math.round(units * 0.2)], JP: [net * 0.15, Math.round(units * 0.15)], SE: [net * 0.1, Math.round(units * 0.1)], BR: [net * 0.05, Math.round(units * 0.05)] } };
      }
    }
    out.games[g.appId] = state;
  }
  return out;
}
